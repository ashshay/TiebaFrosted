name: tieba_frosted
description: "TiebaFrosted — 贴吧客户端，prism_ui 设计语言，Flutter 实现。"
publish_to: 'none'

version: 1.1.5+13

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter
  prism_ui:
    path: D:/coding/repos/FlClash/plugins/prism_ui
  dynamic_color:
    path: D:/coding/repos/FlClash/plugins/dynamic_color
  dio: ^5.7.0
  provider: ^6.1.2
  shared_preferences: ^2.3.0
  sqflite: ^2.4.1
  path_provider: ^2.1.5
  path: ^1.9.0
  crypto: ^3.0.6
  webview_flutter: ^4.10.0
  image_picker: ^1.1.2
  video_player: ^2.9.2
  package_info_plus: ^8.1.0
  flutter_local_notifications: ^23.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: false
  assets:
    # 设置 → 捐赠 里的赞赏码。
    - assets/donate/donate_qr.png
